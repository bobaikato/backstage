name: Test Ota

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ota.yaml'
      - 'package.json'
      - 'yarn.lock'
      - 'docker-compose.deps.yml'
      - 'app-config.docker.yaml'
      - 'scripts/check-docs-quality.js'
      - '.github/workflows/test-ota.yml'
  push:
    paths:
      - 'ota.yaml'
      - 'package.json'
      - 'yarn.lock'
      - 'docker-compose.deps.yml'
      - 'app-config.docker.yaml'
      - 'scripts/check-docs-quality.js'
      - '.github/workflows/test-ota.yml'

concurrency:
  group: ota-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: '1'

jobs:
  contract:
    name: Ota (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            run_shell: bash
            runtime_proof: true
          - name: macos
            os: macos-latest
            run_shell: bash
            runtime_proof: false
          - name: windows
            os: windows-latest
            run_shell: pwsh
            runtime_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up ota
        uses: ota-run/setup@v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Contract gates [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          mkdir -p .ota/ci
          ota validate --json . > .ota/ci/validate.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          validate = json.loads(Path('.ota/ci/validate.json').read_text())
          if not validate.get('ok'):
              print(json.dumps(validate, indent=2))
              sys.exit(1)
          PY
          set +e
          ota doctor --json . > .ota/ci/doctor.json
          doctor_status=$?
          set -e
          DOCTOR_STATUS="$doctor_status" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path('.ota/ci/doctor.json').read_text())
          if report.get('error') and int(os.environ['DOCTOR_STATUS']) != 0:
              print(json.dumps(report, indent=2))
              sys.exit(1)
          if int(os.environ['DOCTOR_STATUS']) != 0 and not report.get('error'):
              summary = report.get('summary') or {}
              print(
                  f"ota doctor is blocked on this runner "
                  f"({summary.get('verdict', 'unknown')}); continuing with JSON truth."
              )
          PY
          ota doctor . || true
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow app .
          ota execution topology --json . > .ota/ci/execution-topology.json

      - name: Contract gates [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ota/ci | Out-Null
          ota validate --json . | Out-File -FilePath .ota/ci/validate.json -Encoding utf8
          $validate = Get-Content .ota/ci/validate.json -Raw | ConvertFrom-Json
          if (-not $validate.ok) {
            $validate | ConvertTo-Json -Depth 100
            exit 1
          }
          ota doctor --json . | Out-File -FilePath .ota/ci/doctor.json -Encoding utf8
          $doctor = Get-Content .ota/ci/doctor.json -Raw | ConvertFrom-Json
          if ($null -ne $doctor.error) {
            $doctor | ConvertTo-Json -Depth 100
            exit 1
          }
          ota doctor .; if ($LASTEXITCODE -ne 0) { Write-Host 'ota doctor is blocked on this runner; continuing with JSON truth.' }
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --workflow verify .
          ota tasks --workflow app .
          ota execution topology --json . | Out-File -FilePath .ota/ci/execution-topology.json -Encoding utf8

      - name: Dry-run proof [bash]
        if: matrix.run_shell == 'bash'
        shell: bash
        run: |
          ota run config:check --dry-run --json . > .ota/ci/run-config-check-dry-run.json
          ota up --workflow verify --dry-run --json . > .ota/ci/up-verify-dry-run.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          run_report = json.loads(Path('.ota/ci/run-config-check-dry-run.json').read_text())
          workflow_report = json.loads(Path('.ota/ci/up-verify-dry-run.json').read_text())

          if not str(run_report.get('preview_status', '')).startswith('RUNNABLE'):
              print(json.dumps(run_report, indent=2))
              sys.exit(1)

          if not str(workflow_report.get('preview_status', '')).startswith('RUNNABLE'):
              print(json.dumps(workflow_report, indent=2))
              sys.exit(1)

          blocker = ((workflow_report.get('summary') or {}).get('primary_blocker') or {})
          if blocker.get('code') != 'OTA_TOOL_MISSING':
              print(json.dumps(workflow_report, indent=2))
              sys.exit(1)

          actions = (((workflow_report.get('plan') or {}).get('actions')) or [])
          if not any('provision `vale`' in str(action) for action in actions):
              print(json.dumps(workflow_report, indent=2))
              sys.exit(1)
          PY

      - name: Dry-run proof [pwsh]
        if: matrix.run_shell == 'pwsh'
        shell: pwsh
        run: |
          ota run config:check --dry-run --json . | Out-File -FilePath .ota/ci/run-config-check-dry-run.json -Encoding utf8
          ota up --workflow verify --dry-run --json . | Out-File -FilePath .ota/ci/up-verify-dry-run.json -Encoding utf8

          $runReport = Get-Content .ota/ci/run-config-check-dry-run.json -Raw | ConvertFrom-Json
          $workflowReport = Get-Content .ota/ci/up-verify-dry-run.json -Raw | ConvertFrom-Json

          if (-not $runReport.preview_status.StartsWith('RUNNABLE')) {
            $runReport | ConvertTo-Json -Depth 100
            exit 1
          }

          if (-not $workflowReport.preview_status.StartsWith('RUNNABLE')) {
            $workflowReport | ConvertTo-Json -Depth 100
            exit 1
          }

          if ($workflowReport.summary.primary_blocker.code -ne 'OTA_TOOL_MISSING') {
            $workflowReport | ConvertTo-Json -Depth 100
            exit 1
          }

          if (-not ($workflowReport.plan.actions | ForEach-Object { $_.ToString() } | Where-Object { $_ -like '*provision `vale`*' })) {
            $workflowReport | ConvertTo-Json -Depth 100
            exit 1
          }

      - name: Execute finite verification
        if: matrix.runtime_proof
        shell: bash
        env:
          CI: 'true'
        run: |
          ota up --workflow app --dry-run --json . > .ota/ci/up-app-dry-run.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path('.ota/ci/up-app-dry-run.json').read_text())
          if not str(report.get('preview_status', '')).startswith('RUNNABLE'):
              print(json.dumps(report, indent=2))
              sys.exit(1)
          PY
          ota run config:check --native --stream .
          ota up --workflow verify --native --stream .

      - name: Execute runtime proof
        if: matrix.runtime_proof
        shell: bash
        env:
          CI: 'true'
        run: |
          docker version
          docker compose version
          ota proof runtime --workflow app --native .

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-${{ matrix.name }}
          path: .ota/
          retention-days: 7
